<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f3a1f"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <linearGradient id="badgeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Decorative wheat icons -->
  <g opacity="0.08" transform="translate(960, 80)">
    <path d="M40 0 L40 220" stroke="#fff" stroke-width="4"/>
    <path d="M40 30 Q20 20 10 0 Q30 10 40 30 M40 30 Q60 20 70 0 Q50 10 40 30" fill="#fff"/>
    <path d="M40 70 Q20 60 10 40 Q30 50 40 70 M40 70 Q60 60 70 40 Q50 50 40 70" fill="#fff"/>
    <path d="M40 110 Q20 100 10 80 Q30 90 40 110 M40 110 Q60 100 70 80 Q50 90 40 110" fill="#fff"/>
    <path d="M40 150 Q20 140 10 120 Q30 130 40 150 M40 150 Q60 140 70 120 Q50 130 40 150" fill="#fff"/>
  </g>

  <!-- Logo + brand -->
  <g transform="translate(80, 80)">
    <g transform="scale(2)">
      <path d="M22 2 C8 8, 2 22, 8 36 C14 44, 26 44, 34 36 C40 28, 38 14, 22 2 Z" fill="url(#leafGrad)"/>
      <path d="M16 18 L26 28 M22 14 L18 22" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none"/>
      <circle cx="36" cy="42" r="4" fill="#ea580c"/>
    </g>
    <text x="120" y="50" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="1">АГРОСНАБ</text>
    <text x="120" y="86" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700" fill="#bbf7d0" letter-spacing="6">ПІВДЕНЬ</text>
  </g>

  <!-- Main heading -->
  <text x="80" y="280" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="900" fill="#ffffff">Засоби захисту рослин</text>
  <text x="80" y="350" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="900" fill="#ffffff">для Півдня України</text>

  <!-- Subheading -->
  <text x="80" y="410" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="500" fill="#dcfce7">Миколаїв · Херсон · Одеса · з 2010 року</text>

  <!-- Save badge -->
  <g transform="translate(80, 460)">
    <rect width="380" height="80" rx="40" fill="url(#badgeGrad)"/>
    <text x="40" y="52" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="800" fill="#ffffff">Економія до 60%</text>
  </g>

  <!-- Right column stats -->
  <g transform="translate(720, 270)">
    <g>
      <text x="0" y="0" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="900" fill="#ffffff">1000+</text>
      <text x="0" y="34" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500" fill="#bbf7d0">препаратів у каталозі</text>
    </g>
    <g transform="translate(0, 100)">
      <text x="0" y="0" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="900" fill="#ffffff">500+</text>
      <text x="0" y="34" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500" fill="#bbf7d0">фермерів партнерів</text>
    </g>
    <g transform="translate(0, 200)">
      <text x="0" y="0" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="900" fill="#ffffff">15</text>
      <text x="0" y="34" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500" fill="#bbf7d0">років досвіду</text>
    </g>
  </g>

  <!-- Footer URL -->
  <text x="80" y="595" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" fill="#ffffff" opacity="0.85">agrosnab-pivden.com.ua</text>
</svg>
