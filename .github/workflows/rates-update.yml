name: Update Minfin interbank rates

on:
  schedule:
    - cron: "0 5 1,4,7,10,13,16,19,22,25,28 * *"
  workflow_dispatch:

jobs:
  update-rates:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Update Minfin rates
        env:
          MINFIN_API_KEY: ${{ secrets.MINFIN_API_KEY }}
        run: npm run rates:update
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet public/currency-rates.json; then
            echo "Rates unchanged - no push needed."
            exit 0
          fi
          git add public/currency-rates.json
          git commit -m "chore(rates): update Minfin interbank rate"
          git push origin main
